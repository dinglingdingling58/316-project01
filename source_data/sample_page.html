<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>示例 HTML 页面</title>
</head>
<body>
    <h1>主标题</h1>
    <p>这是一个示例 HTML 页面，用于测试 HTML 解析功能。</p>
    
    <h2>二级标题</h2>
    <p>HTML 解析器应该能够提取：</p>
    <ul>
        <li>页面标题</li>
        <li>各级标题</li>
        <li>链接</li>
        <li>表格</li>
    </ul>
    
    <h3>三级标题：链接示例</h3>
    <p>
        <a href="https://example.com">示例链接 1</a>
        <a href="https://test.com">示例链接 2</a>
    </p>
    
    <h3>三级标题：表格示例</h3>
    <table border="1">
        <tr>
            <th>列 1</th>
            <th>列 2</th>
        </tr>
        <tr>
            <td>数据 1</td>
            <td>数据 2</td>
        </tr>
    </table>
    
    <h4>四级标题</h4>
    <p>这是四级标题的内容。</p>
</body>
</html>
